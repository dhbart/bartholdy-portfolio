<section class="project-details">

    <div class="container">

        @if (project(); as project) {

            <bp-back-button
                [label]="ui().projectDetails.backToProjects"
                link="/"
                fragment="projects" />
            <bp-detail-header
                [title]="project.title"
                [subtitle]="project.headline" />

            <div class="project-details__wrapper">

                <div class="project-details__media">

                                        <bp-image-preview
                                            [src]="project.imageUrl"
                                            [alt]="project.title" />

                </div>

                <div class="project-details__content">

                    <div class="project-details__section">

                        <bp-section-title [title]="ui().projectDetails.challenge" />

                        <p>
                            {{ project.challenge }}
                        </p>

                    </div>

                    <div class="project-details__section">

                        <bp-section-title [title]="ui().projectDetails.solution" />

                        <p>
                            {{ project.solution }}
                        </p>

                    </div>

                    <div class="project-details__section">

                        <bp-section-title [title]="ui().projectDetails.technologies" />
                        <bp-technology-badges [technologies]="project.technologies" />

                    </div>

                                        <bp-external-links [links]="externalLinks()" />

                </div>

            </div>

                } @else if (status() === 'loading' || status() === 'reloading') {
                                                        <bp-loading-state message="Loading project..." />
                } @else {
                            <bp-empty-state
                                [title]="ui().projectDetails.projectNotFound"
                                [message]="ui().projectDetails.requestProjectNotFound"
                                [linkLabel]="ui().projectDetails.backToProjects" />
            }

    </div>

</section>
