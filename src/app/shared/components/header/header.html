<header class="header">

    <div class="container">

            <nav class="header__navbar" [attr.aria-label]="localeService.translations().buttons.primaryNavigation">

            <a
              class="header__logo"
              routerLink="/"
              [attr.aria-label]="localeService.translations().buttons.home"
              (click)="onLogoClick($event)">
                <img
                    class="header__logo"
                    ngSrc="/assets/images/dhbart-glass-logo.png"
                    width="50"
                    height="50"
                    alt="">

            </a>

            <ul class="header__menu">
                @for (item of menus().navigation; track item.fragment) {
                  <li class="header__menu-item">
                    <a class="header__menu-link"
                       [routerLink]="['/']"
                       [fragment]="item.fragment">
                      {{ item.label }}
                    </a>
                  </li>
                }
              </ul>

            <div class="header__actions">
              <label class="header__locale-selector">
                <span id="language-label" class="visually-hidden">
                  {{ localeService.translations().buttons.selectLanguage }}
                </span>
                <select
                  [value]="selectedLocale().code"
                  (change)="changeLocale($event)"
                  aria-labelledby="language-label"
                  [attr.aria-label]="selectedLocale().name">
                  @for (locale of localeService.supportedLocales; track locale.code) {
                    <option [value]="locale.code" [selected]="locale.code === selectedLocale().code">
                      {{ locale.emoji }} {{ locale.name }}
                    </option>
                  }
                </select>
              </label>

              <button
                type="button"
                class="header__theme-toggle"
                [attr.aria-label]="
                  themeService.isDark()
                    ? localeService.translations().buttons.switchToLightTheme
                    : localeService.translations().buttons.switchToDarkTheme
                "
                [attr.aria-pressed]="themeService.isDark()"
                (click)="themeService.toggle()">

                @if (themeService.isDark()) {
                  <img
                    class="header__theme-icon"
                    ngSrc="/assets/icons/sun.svg"
                    width="20"
                    height="20"
                    alt="">
                } @else {
                  <img
                    class="header__theme-icon"
                    ngSrc="/assets/icons/moon.svg"
                    width="20"
                    height="20"
                    alt="">
                }

              </button>
            </div>

        </nav>

    </div>

</header>
