<section class="featured-project" id="featured-project">

    <div class="container">

        <h2 class="featured-project__title section-title">

            Featured Project

        </h2>
          @if (project) {

            <article class="featured-project__card card"
              role="link"
              tabindex="0"
              (click)="openProject(project.id, $event)"
              (keydown)="onCardKeydown($event, project.id)">



                <img
                    class="featured-project__image project-image"
                    [ngSrc]="project.image"
                    [alt]="project.title"
                    width="640"
                    height="360">

                <div class="featured-project__content">

                    <h3>

                        {{ project.title }}

                    </h3>

                    <p>

                        {{ project.description }}

                    </p>

                    <div class="featured-project__technologies">
                      @for (technology of project.technologies; track technology) {
                        <span class="featured-project__tag">
                          {{ technology }}
                        </span>
                      }
                    </div>

                </div>

            </article>

          }

    </div>

</section>
