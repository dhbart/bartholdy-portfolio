<section class="featured-project" id="projects">

    <div class="container">

        <h2 class="featured-project__title section-title">

            Featured Project

        </h2>

        <article class="featured-project__card card">

            @if (project) {

                <img
                    class="featured-project__image project-image"
                    [src]="project.image"
                    [alt]="project.title">

                <div class="featured-project__content">

                    <h3>

                        {{ project.title }}

                    </h3>

                    <p>

                        {{ project.description }}

                    </p>

                    <p>

                        {{ project.technologies.join(' - ') }}

                    </p>

                </div>

            }

        </article>

    </div>

</section>
