<section class="about" id="about">

    <div class="container">

        <h2 class="about__title section-title">

            {{ about.title }}

        </h2>

        <div class="about__content">

            @for (paragraph of about.description; track $index) {

                <p>

                    {{ paragraph }}

                </p>

            }

        </div>

    </div>

</section>
