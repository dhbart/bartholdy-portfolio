<section class="hero">

    <div class="container">

        <div class="hero__wrapper">

            <div class="hero__content">

                <span class="hero__greeting">
                    {{ hero()?.greeting }}
                </span>

                <h1 class="hero__title">
                    {{ hero()?.name }}
                </h1>

                <h2 class="hero__subtitle">
                    {{ hero()?.title }}
                </h2>

                <p class="hero__description">
                    {{ hero()?.description }}
                </p>

                <div class="hero__actions">

                    <a
                        class="hero__button button hero__button--primary"
                        [href]="hero()?.primaryButtonUrl">

                        {{ hero()?.primaryButtonLabel }}

                    </a>

                    <a
                      class="hero__button button hero__button--secondary"
                      [href]="hero()?.secondaryButtonUrl"
                      download="Daniel-Bartholdy-CV.pdf"
                      target="_blank"
                      rel="noopener">

                      {{ hero()?.secondaryButtonLabel }}

                    </a>

                </div>

            </div>

            <div class="hero__visual">

                <div class="hero__visual">

                  <img
                    class="hero__visual-image"
                    ngSrc="/assets/images/daniel-bartholdy.png"
                    width="480"
                    height="560"
                    priority
                    alt="Daniel Bartholdy">
                </div>

            </div>

        </div>

    </div>

</section>
