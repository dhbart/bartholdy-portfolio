<section class="about" id="about" bpRevealOnScroll>

    <div class="container">

                @if (status() === 'loading' || status() === 'reloading') {
                    <bp-loading-state [message]="ui().resourceStates.loading" />
                } @else if (status() === 'error') {
                    <p role="alert">{{ ui().resourceStates.error }}</p>
                } @else if (about(); as about) {

        <h2 class="about__title section-title">

                        {{ about.title }}

        </h2>

        <div class="about__content">

          {{ about.description }}


        </div>

                } @else {
                    <p>{{ ui().resourceStates.empty }}</p>
                }

    </div>

</section>
