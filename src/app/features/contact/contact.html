<section class="contact" id="contact" bpRevealOnScroll>
  <div class="container">
    <div class="contact__content">
      @if (contacts()) {
        <div class="contact__intro">
          <h2 class="contact__title section-title">
            {{ contacts()!.title }}
          </h2>

          <p class="contact__description">
            {{ contacts()!.description }}
          </p>

          <p class="contact__location">
            {{ contacts()!.location }}
          </p>

          <span class="contact__availability">
            {{ contacts()!.availability }}
          </span>
        </div>

        <nav class="contact__links" [attr.aria-label]="ui().sections.contact">
          @for (link of contacts()!.links; track link.url) {


            <a
              class="contact__link"
              [href]="link.url"
              target="_blank"
              rel="noopener noreferrer">

              <img
                class="contact__link-icon"
                [ngSrc]="'/assets/icons/' + link.icon + '.svg'"
                width="24"
                height="24"
                alt="">

              <span class="contact__link-label">
                {{ link.label }}
              </span>

              <span class="contact__link-value">
                {{ link.value }}
              </span>
            </a>
          }
        </nav>
      }
    </div>
  </div>
</section>
